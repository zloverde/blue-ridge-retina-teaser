<!--
  Cloudflare Pages (static): Place index.html and logo.png in the same
  directory. Push to GitHub, connect the repo to Cloudflare Pages, use no
  build command, and set the publish directory to the folder that contains
  index.html (often "/" at the repository root).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Retina specialty care coming soon">
  <title>Blue Ridge Retina</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      min-height: 100dvh;
      padding: max(1.25rem, env(safe-area-inset-top))
        max(1.25rem, env(safe-area-inset-right))
        max(1.25rem, env(safe-area-inset-bottom))
        max(1.25rem, env(safe-area-inset-left));
      background: #ffffff;
      color: #1a2b5e;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 100%;
    }
    main img {
      display: block;
      max-width: 260px;
      width: 100%;
      height: auto;
    }
    @media (min-width: 768px) {
      main img {
        max-width: 380px;
      }
    }
    .coming {
      margin: 1.5rem 0 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #1a2b5e;
    }
  </style>
</head>
<body>
  <main>
    <img
      src="logo.png"
      width="1024"
      height="682"
      alt="Blue Ridge Retina"
      loading="eager"
    >
    <p class="coming">Coming Soon</p>
  </main>
</body>
</html>
